name: ☁️ Déploiement GH Pages

env:
  CLOUDFLARE_CAPTCHA_KEY: ${{ secrets.CLOUDFLARE_CAPTCHA_KEY }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ astro ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Téléchargement du code"
        uses: actions/checkout@v4
      - name: "📝 Création de l'environnement"
        run: |
          echo "CLOUDFLARE_CAPTCHA_KEY=${{ secrets.CLOUDFLARE_CAPTCHA_KEY }}" >> .env
          echo "DISCORD_WEBHOOK=${{ secrets.DISCORD_WEBHOOK }}" >> .env
      - name: "✨️ CI Astro"
        uses: withastro/action@v4
        with:
          package-manager: pnpm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "🌐 Déploiement"
        id: deployment
        uses: actions/deploy-pages@v4
